name: Android build and verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verified bundled depth model
        run: bash scripts/fetch-model.sh
      - name: Unit tests, lint and installable APK
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease assembleDebugAndroidTest --no-daemon
      - name: Prepare download
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/PMDDcam-0.4.0.apk
          cd release
          sha256sum PMDDcam-0.4.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PMDDcam-install
          path: release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: instrumented-tests
          path: app/build/outputs/apk/androidTest/debug/*.apk

  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: bash scripts/fetch-model.sh
      - name: Compile test APKs before starting the emulator
        # Avoid competing with Android's first boot for CPU and memory.
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash scripts/device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: app/build/reports/androidTests/

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, device-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PMDDcam-install
          path: release
      - name: Publish verified preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            gh release upload v0.4.0 release/* --clobber
          else
            gh release create v0.4.0 release/* --target '${{ github.sha }}' --title 'PMDDcam 0.4.0 · Android Preview' --prerelease --notes '80 clearly differentiated local looks: painted regions, comic contours, watercolor paper, oil strokes, neon bloom, print screens and fixed retro palettes. New autonomous object animation with independent amount and speed, protected anchors, lifecycle pause and six-direction viewer control. Original/PMDD comparison, offline processing, original-preserving projects and optional shutter sound remain included. Static PNG/JPEG export stays still. See CHANGELOG for details.'
          fi
